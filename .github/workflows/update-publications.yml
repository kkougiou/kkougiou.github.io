# Once a month: (1) refreshes the "Cited by" counts from OpenAlex and publishes
# them straight away; (2) checks Crossref for new papers by Kougioumoutzis that
# are not on the site yet. New papers are added as hidden drafts in a pull request, so
# nothing is published until you review the PR, remove `draft: true` from the
# ones you want, and merge.
#
# To add a single paper yourself:  python scripts/crossref_publications.py add <DOI>
name: Update Publications

on:
  schedule:
    - cron: '17 4 3 * *'  # 04:17 UTC on the 3rd of every month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Refresh citation counts (OpenAlex)
        run: python scripts/crossref_publications.py counts
      - name: Commit citation counts
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add content/publication data/citations.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Update citation counts from OpenAlex"
            git push
          fi
      - name: Look for new papers on Crossref
        run: python scripts/crossref_publications.py discover --write
      - name: Open a pull request with any new papers
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'content: add new publications from Crossref (drafts)'
          title: New publications found on Crossref
          body: |
            New works by Kougioumoutzis were found on Crossref that are not on the site yet.
            They were added with `draft: true`, so they stay hidden. For each one you want
            to show, delete the `draft: true` line (and fix anything that looks off), then merge.
            Close this PR to ignore them.
          branch: crossref-new-publications
          delete-branch: true
          labels: automated-pr, content
