name: Crossref probe (temporary)
on:
  push:
    branches: ['crossref-probe']
permissions:
  contents: write
jobs:
  counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: site-refresh}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - run: python scripts/crossref_publications.py counts
      - run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add content/publication data/citations.yaml
          git commit -m "Add citation counts from OpenAlex"
          git push origin HEAD:site-refresh
