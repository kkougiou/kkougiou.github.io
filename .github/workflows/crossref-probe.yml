name: Crossref probe (temporary)
on:
  push:
    branches: ['crossref-probe']
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: site-refresh}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - run: python scripts/crossref_publications.py abstracts
      - run: python scripts/crossref_publications.py metrics
      - run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add content/publication data/metrics.yaml
          git commit -m "Add abstracts and profile metrics (Crossref/OpenAlex)"
          git push origin HEAD:site-refresh
  supplement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JBI 2017 supplement and extract its images
        run: |
          mkdir -p figs/jbi
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sSL -A "$UA" -o figs/jbi/sup.docx -w "%{http_code} %{content_type}\n" "https://onlinelibrary.wiley.com/action/downloadSupplement?doi=10.1111%2Fjbi.12920&file=jbi12920-sup-0001-AppendixS1-S2.docx" | tee figs/jbi/status.txt
          file figs/jbi/sup.docx | tee -a figs/jbi/status.txt
          (cd figs/jbi && unzip -o -q sup.docx 'word/media/*' 2>>status.txt; ls -la word/media >> status.txt 2>&1) || true
          rm -f figs/jbi/sup.docx
      - run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add figs && git commit -m "supplement [skip ci]" && git push
