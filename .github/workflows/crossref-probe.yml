name: Crossref probe (temporary)
on:
  push:
    branches: ['crossref-probe']
permissions:
  contents: write
jobs:
  figs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pymupdf
      - run: python scripts/fetch_figs.py
      - name: Render PDF pages and extract images when only a PDF was found
        run: |
          python - <<'PY'
          import fitz, glob, os
          for pdf in glob.glob("figs/*/paper.pdf"):
              d = os.path.dirname(pdf); doc = fitz.open(pdf)
              for i, page in enumerate(doc):
                  page.get_pixmap(dpi=60).save(f"{d}/page{i+1:02d}.png")
                  for j, img in enumerate(page.get_images(full=True)):
                      pix = fitz.Pixmap(doc, img[0])
                      if pix.width > 400 and pix.height > 300:
                          if pix.n - pix.alpha >= 4: pix = fitz.Pixmap(fitz.csRGB, pix)
                          pix.save(f"{d}/img_p{i+1:02d}_{j}.png")
          PY
      - run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add figs && git commit -m "figures [skip ci]" && git push
