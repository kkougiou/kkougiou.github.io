name: Crossref probe (temporary)
on:
  push:
    branches: ['crossref-probe']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - run: python scripts/crossref_publications.py enrich --out scripts/crossref_dump.json
      - run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add scripts/crossref_dump.json
          git commit -m "crossref dump [skip ci]"
          git push
